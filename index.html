<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <title>Send a message SEM </title>
    <link href="style.css" rel="stylesheet"></head>
    <body>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #f5f5f5;
                padding: 20px;
            }

            .form {
                max-width: 600px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
                overflow: hidden;
            }

            .messages-container {
                flex: 1;
                min-height: 200px;
                max-height: 500px;
                overflow-y: auto;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .message {
                background: #e3f2fd;
                color: #1a1a1a;
                border-radius: 12px;
                padding: 10px 16px;
                align-self: flex-start;
                word-break: break-word;
                line-height: 1.4;
                max-width: 80%;
            }

            .message-author {
                font-size: 12px;
                font-weight: 600;
                color: #1565c0;
                margin-bottom: 2px;
            }

            .message-text {
                word-break: break-word;
            }

            .message-time {
                font-size: 11px;
                color: #9e9e9e;
                text-align: right;
                margin-top: 4px;
            }

            .form-input {
                width: 100%;
                padding: 14px 16px;
                border: none;
                outline: none;
                font-size: 16px;
                border-top: 1px solid #e0e0e0;
                background: #fff;
            }

            .form-input::placeholder {
                color: #9e9e9e;
            }
        </style>
        <form class="form" action="/">
            <input class="form-input" id="author-input" name="author" placeholder="Ваше имя" type="text">
            <div class="messages-container"></div>
            <input class="form-input" id="message-input" name="message-text" placeholder="Введите сообщение" type="text">
        </form>
        <script>
            const form = document.querySelector('form');
            const authorInput = document.getElementById('author-input');
            const messageInput = document.getElementById('message-input');
            const messagesContainer = document.querySelector('.messages-container');

            // Загрузить сохранённое имя
            authorInput.value = localStorage.getItem('author') || '';

            form.addEventListener('submit', handleSubmit);

            function getMessages() {
                return JSON.parse(localStorage.getItem('messages') || '[]');
            }

            function saveMessages(messages) {
                localStorage.setItem('messages', JSON.stringify(messages));
            }

            function formatTime(timestamp) {
                const date = new Date(timestamp);
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return hours + ':' + minutes;
            }

            function renderMessages() {
                const messages = getMessages();
                messagesContainer.innerHTML = '';
                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message';

                    const authorDiv = document.createElement('div');
                    authorDiv.className = 'message-author';
                    authorDiv.textContent = msg.author || 'Аноним';

                    const textDiv = document.createElement('div');
                    textDiv.className = 'message-text';
                    textDiv.textContent = msg.text;

                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'message-time';
                    timeDiv.textContent = formatTime(msg.timestamp);

                    div.appendChild(authorDiv);
                    div.appendChild(textDiv);
                    div.appendChild(timeDiv);
                    messagesContainer.appendChild(div);
                });
            }

            function handleSubmit(event) {
                event.preventDefault();
                const text = messageInput.value.trim();
                const author = authorInput.value.trim() || 'Аноним';

                if (text === '') return;

                // Сохранить имя
                localStorage.setItem('author', author);

                const messages = getMessages();
                messages.push({
                    text: text,
                    author: author,
                    timestamp: Date.now()
                });
                saveMessages(messages);

                const div = document.createElement('div');
                div.className = 'message';

                const authorDiv = document.createElement('div');
                authorDiv.className = 'message-author';
                authorDiv.textContent = author;

                const textDiv = document.createElement('div');
                textDiv.className = 'message-text';
                textDiv.textContent = text;

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = formatTime(Date.now());

                div.appendChild(authorDiv);
                div.appendChild(textDiv);
                div.appendChild(timeDiv);
                messagesContainer.appendChild(div);

                messageInput.value = '';
            }

            renderMessages();
        </script>
    <script type="text/javascript" src="bundle.js"></script></body>
</html>
